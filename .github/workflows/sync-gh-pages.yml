# อัปเดต branch gh-pages ให้ตรงกับ main ทุกครั้งที่ push (เว็บ GitHub Pages ใช้ branch gh-pages)
name: Sync gh-pages
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push --force origin HEAD:gh-pages
